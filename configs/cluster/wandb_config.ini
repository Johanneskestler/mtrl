# W&B Configuration for MTRL Cluster Training
# Place in mtrl project root or pass via environment

[wandb]
# Project settings
project = Robot_learning_2025
entity = Robot_learning_2025
mode = online  # online, offline, disabled

# Run configuration
tags = mtrl,cluster,mt10
notes = MTRL cluster training with enhanced logging

# Logging configuration
[logging]
log_frequency = 100
log_gradients = true
log_network_stats = true
log_task_performance = true
log_system_stats = true

# Metrics to track
[metrics]
track_loss_curves = true
track_reward_curves = true
track_success_rates = true
track_network_parameters = true
track_learning_rates = true
track_entropy = true
track_task_weights = true

# System monitoring
[system_monitoring]
track_gpu_memory = true
track_gpu_utilization = true
track_cpu_utilization = true
track_training_speed = true
log_interval = 100

# Checkpointing
[checkpointing]
save_best_model = true
save_latest_model = true
save_frequency = 100000
log_checkpoints_as_artifacts = true

# Advanced options
[advanced]
save_code = true
log_system_info = true
offline_sync_wait_time = 10
